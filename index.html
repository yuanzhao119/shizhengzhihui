<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐山市路北区市政设施服务 · 智慧工具导航</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  /* ==========================================================
     基础重置
     ========================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy-950: #05121f;
    --navy-900: #0a2038;
    --navy-800: #0f2c4a;
    --navy-700: #15395f;
    --navy-600: #1c4a78;
    --blue-500: #2b7bc4;
    --blue-400: #4a95d6;
    --gold: #d4af37;
    --gold-2: #e6c65a;
    --gold-3: #f5e6b0;
    --text: #0f2236;
    --text-muted: #5b6e82;
    --border: #dfe7f0;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(ellipse at 15% 0%, #123a5f 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, #0d2f52 0%, transparent 55%),
      linear-gradient(160deg, #05121f 0%, #0f2c4a 45%, #071829 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  body.modal-open { overflow: hidden; }

  /* ==========================================================
     页面容器
     ========================================================== */
  .page-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1340px;
    margin: 0 auto;
    padding: 42px 32px 60px;
  }

  /* ==========================================================
     头部（无 LOGO）
     ========================================================== */
  .header {
    text-align: center;
    margin-bottom: 44px;
    position: relative;
  }

  .org-badge {
    display: inline-block;
    padding: 6px 22px;
    border: 1px solid rgba(212, 175, 55, 0.45);
    border-radius: 40px;
    color: var(--gold-2);
    font-size: 0.78rem;
    letter-spacing: 3px;
    font-weight: 500;
    margin-bottom: 20px;
    background: rgba(212, 175, 55, 0.06);
  }

  .header h1 {
    font-size: 2.1rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 4px;
    line-height: 1.35;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  }

  .header .divider {
    width: 76px;
    height: 3px;
    margin: 18px auto 16px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 2px;
  }

  .header .subtitle {
    color: #9fbcd8;
    font-size: 0.95rem;
    letter-spacing: 5px;
    font-weight: 400;
    opacity: 0.9;
  }

  /* ==========================================================
     卡片网格
     ========================================================== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px;
  }

  .card {
    position: relative;
    background: #ffffff;
    border-radius: 14px;
    padding: 18px 20px 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.3s ease;
    overflow: hidden;
    animation: cardIn 0.45s cubic-bezier(0.4, 0, 0.2, 1) backwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-3), var(--gold));
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.3);
  }

  .card:hover::before { opacity: 1; }

  /* 图标 + 标题同一行 */
  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding-right: 46px;
  }

  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.12rem;
    color: var(--navy-700);
    background: linear-gradient(135deg, #edf4fb 0%, #d8e8f7 100%);
    border: 1px solid rgba(43, 123, 196, 0.14);
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9);
    flex-shrink: 0;
  }

  .card-title {
    font-size: 0.98rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.42;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-domain {
    font-size: 0.77rem;
    color: #8a9db3;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    word-break: break-all;
    line-height: 1.4;
  }

  .card-domain i {
    font-size: 0.66rem;
    color: var(--blue-400);
    flex-shrink: 0;
  }

  /* 立即访问按钮 */
  .card-cta {
    margin-top: auto;
    width: 100%;
    padding: 9px 14px;
    border-radius: 9px;
    border: 1.5px solid var(--navy-700);
    background: transparent;
    color: var(--navy-700);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1.2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.26s ease;
  }

  .card-cta:hover {
    background: var(--navy-700);
    color: #ffffff;
    border-color: var(--navy-700);
    box-shadow: 0 6px 16px rgba(21, 57, 95, 0.28);
  }

  .card-cta i {
    font-size: 0.74rem;
    transition: transform 0.26s ease;
  }

  .card-cta:hover i { transform: translateX(3px); }

  /* 卡片操作按钮（悬停显示） */
  .card-actions {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 5px;
    opacity: 0;
    transform: translateY(-6px);
    transition: all 0.26s ease;
    z-index: 2;
  }

  .card:hover .card-actions { opacity: 1; transform: translateY(0); }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    background: #eef3f9;
    color: #556880;
    font-size: 0.72rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .icon-btn:hover {
    background: var(--navy-700);
    color: #ffffff;
    transform: scale(1.06);
  }

  .icon-btn.danger:hover {
    background: #c0392b;
    color: #ffffff;
  }

  /* 空状态 */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: #8fa7bf;
  }

  .empty-state i {
    font-size: 3.2rem;
    color: rgba(212, 175, 55, 0.4);
    margin-bottom: 20px;
    display: block;
  }

  .empty-state p { font-size: 1.05rem; letter-spacing: 1px; }

  /* ==========================================================
     悬浮添加按钮
     ========================================================== */
  .fab {
    position: fixed;
    right: 34px;
    bottom: 34px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 1.4rem;
    color: var(--navy-900);
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 55%, var(--gold) 100%);
    background-size: 200% 200%;
    box-shadow:
      0 12px 32px rgba(212, 175, 55, 0.45),
      0 0 0 5px rgba(212, 175, 55, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: all 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: fabPulse 3s ease-in-out infinite;
  }

  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 12px 32px rgba(212,175,55,0.45), 0 0 0 5px rgba(212,175,55,0.12); }
    50%      { box-shadow: 0 12px 38px rgba(212,175,55,0.6),  0 0 0 10px rgba(212,175,55,0.06); }
  }

  .fab:hover {
    transform: translateY(-5px) scale(1.06) rotate(90deg);
    animation: none;
  }

  .fab:active { transform: scale(0.96) rotate(90deg); }

  /* ==========================================================
     模态框通用
     ========================================================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 15, 27, 0.78);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 200;
    animation: fadeIn 0.22s ease;
  }

  .modal-overlay.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    background: #ffffff;
    border-radius: 20px;
    padding: 30px 30px 26px;
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.55);
    animation: modalIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(24px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal h3 {
    font-size: 1.18rem;
    font-weight: 700;
    color: var(--navy-800);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 2px solid #eef4fa;
    position: relative;
  }

  .modal h3::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 56px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
  }

  .modal-desc {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .modal-tool-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--navy-800);
    background: #f4f8fc;
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 14px;
  }

  .url-display {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 16px;
    background: #f0f6fc;
    border: 1.5px dashed var(--blue-400);
    border-radius: 11px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.86rem;
    color: var(--navy-700);
    line-height: 1.55;
    word-break: break-all;
    margin-bottom: 14px;
  }

  .url-display i {
    color: var(--blue-500);
    margin-top: 2px;
    flex-shrink: 0;
  }

  .modal-hint {
    font-size: 0.79rem;
    color: #8ba0b5;
    line-height: 1.6;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }

  .modal-hint i { margin-top: 2px; color: var(--blue-400); flex-shrink: 0; }

  /* 表单 */
  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--navy-700);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  .form-control {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #d8e3ee;
    border-radius: 10px;
    font-size: 0.92rem;
    font-family: inherit;
    color: var(--text);
    background: #f9fcff;
    transition: all 0.22s ease;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--blue-500);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(43, 123, 196, 0.12);
  }

  .icon-preview-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-preview {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: var(--navy-700);
    background: linear-gradient(135deg, #edf4fb, #d8e8f7);
    border: 1px solid rgba(43, 123, 196, 0.16);
  }

  .icon-picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap: 8px;
    margin-top: 12px;
    padding: 10px;
    max-height: 132px;
    overflow-y: auto;
    background: #f7fafd;
    border: 1px solid #e8eff6;
    border-radius: 10px;
  }

  .icon-chip {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid #e0e9f2;
    background: #ffffff;
    color: #435d78;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
  }

  .icon-chip:hover {
    background: var(--navy-700);
    color: #ffffff;
    border-color: var(--navy-700);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(21, 57, 95, 0.25);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }

  .btn {
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.22s ease;
  }

  .btn-secondary {
    background: #eef3f9;
    color: #556880;
  }

  .btn-secondary:hover { background: #e0e9f2; }

  .btn-primary {
    background: linear-gradient(135deg, var(--navy-800), var(--navy-600));
    color: #ffffff;
    box-shadow: 0 5px 16px rgba(21, 57, 95, 0.32);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 24px rgba(21, 57, 95, 0.42);
  }

  .btn-primary:active { transform: translateY(0); }

  /* ==========================================================
     页脚
     ========================================================== */
  .footer {
    margin-top: 48px;
    text-align: center;
    color: #7c9bb8;
    font-size: 0.82rem;
    line-height: 2;
    letter-spacing: 0.4px;
  }

  .footer i { color: var(--gold-2); margin-right: 5px; }

  /* ==========================================================
     响应式
     ========================================================== */
  @media (max-width: 768px) {
    .page-wrap { padding: 28px 18px 48px; }
    .header { margin-bottom: 32px; }
    .header h1 { font-size: 1.42rem; letter-spacing: 2px; }
    .header .subtitle { font-size: 0.8rem; letter-spacing: 2px; }
    .org-badge { font-size: 0.7rem; letter-spacing: 1.5px; padding: 5px 14px; }

    .grid { grid-template-columns: 1fr; gap: 14px; }
    .card { padding: 16px 18px 14px; }
    .card-head { gap: 10px; padding-right: 44px; }
    .card-icon { width: 38px; height: 38px; font-size: 1rem; border-radius: 11px; }
    .card-title { font-size: 0.94rem; }
    .card-cta { padding: 8px 12px; font-size: 0.82rem; }

    .fab { right: 20px; bottom: 20px; width: 54px; height: 54px; font-size: 1.25rem; }

    .modal { padding: 24px 20px 20px; }
    .modal-actions { flex-direction: column-reverse; }
    .modal-actions .btn { width: 100%; justify-content: center; }
  }

  @media (min-width: 769px) and (max-width: 1080px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (hover: none) {
    .card-actions { opacity: 1; transform: none; }
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(21, 57, 95, 0.28);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(21, 57, 95, 0.45); }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- ================= 头部（无 LOGO） ================= -->
  <header class="header">
    <div class="org-badge">唐山市城市管理综合行政执法局</div>
    <h1>唐山市路北区市政设施服务</h1>
    <div class="divider"></div>
    <p class="subtitle">智慧工具导航 · 一键直达</p>
  </header>

  <!-- ================= 卡片网格 ================= -->
  <main class="grid" id="grid"></main>

  <!-- ================= 页脚 ================= -->
  <footer class="footer">
    <p><i class="fa-solid fa-circle-info"></i> 点击「立即访问」将先展示网址确认框，确认后在新窗口打开目标系统</p>
    <p>部分内部系统（如联合审批平台）需在政务内网环境下访问 · 全部数据保存在本机浏览器</p>
  </footer>

</div>

<!-- ================= 悬浮添加按钮 ================= -->
<button class="fab" id="fabAdd" title="添加新工具">
  <i class="fa-solid fa-plus"></i>
</button>

<!-- ================= 访问确认模态框 ================= -->
<div class="modal-overlay" id="accessModal">
  <div class="modal">
    <h3><i class="fa-solid fa-shield-halved" style="color:#2b7bc4"></i> 确认访问</h3>
    <p class="modal-desc">您即将访问以下系统 / 网页：</p>
    <div class="modal-tool-name" id="accessTitle"></div>
    <div class="url-display">
      <i class="fa-solid fa-link"></i>
      <span id="accessUrl"></span>
    </div>
    <p class="modal-hint">
      <i class="fa-solid fa-circle-info"></i>
      <span>请核对链接地址无误后再访问。若为外部网站，请注意信息安全。</span>
    </p>
    <div class="modal-actions">
      <button class="btn btn-secondary" data-close>取消</button>
      <button class="btn btn-primary" id="accessConfirmBtn">确认访问 <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>
</div>

<!-- ================= 编辑 / 添加模态框 ================= -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3 id="editModalTitle"><i class="fa-solid fa-pen-to-square"></i> 编辑工具</h3>

    <div class="form-group">
      <label for="editTitle">工具名称</label>
      <input class="form-control" id="editTitle" maxlength="60" placeholder="例如：停工通知书">
    </div>

    <div class="form-group">
      <label for="editUrl">网址</label>
      <input class="form-control" id="editUrl" placeholder="https://...">
    </div>

    <div class="form-group">
      <label for="editIcon">图标</label>
      <div class="icon-preview-row">
        <div class="icon-preview" id="editIconPreview"><i class="fa-solid fa-link"></i></div>
        <input class="form-control" id="editIcon" placeholder="fa-solid fa-link">
      </div>
      <div class="icon-picker" id="editIconPicker"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" data-close>取消</button>
      <button class="btn btn-primary" id="editSaveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================
     常量
     ========================================================== */
  const STORAGE_KEY = 'lbsz_gongju_nav_v2';

  const ICON_LIST = [
    'fa-solid fa-file-signature',
    'fa-solid fa-envelope-open-text',
    'fa-solid fa-pen-to-square',
    'fa-solid fa-list-check',
    'fa-solid fa-calculator',
    'fa-solid fa-road',
    'fa-solid fa-cloud',
    'fa-solid fa-file-contract',
    'fa-solid fa-laptop-file',
    'fa-solid fa-link',
    'fa-solid fa-building',
    'fa-solid fa-tools',
    'fa-solid fa-hard-hat',
    'fa-solid fa-clipboard-list',
    'fa-solid fa-folder-open',
    'fa-solid fa-chart-line',
    'fa-solid fa-database',
    'fa-solid fa-shield-halved',
    'fa-solid fa-sitemap',
    'fa-solid fa-globe',
    'fa-solid fa-map-location-dot',
    'fa-solid fa-table-list',
    'fa-solid fa-stamp',
    'fa-solid fa-truck-fast',
    'fa-solid fa-helmet-safety',
    'fa-solid fa-ruler-combined',
    'fa-solid fa-compass-drafting',
    'fa-solid fa-warehouse',
    'fa-solid fa-users',
    'fa-solid fa-clock',
    'fa-solid fa-compass',
    'fa-solid fa-city'
  ];

  const DEFAULT_STATE = {
    tools: [
      { id: 't1',  title: '停工通知书（正联/副联）',            url: 'https://yuanzhao119.github.io/tgtzd/',                    icon: 'fa-solid fa-file-signature' },
      { id: 't2',  title: '意见函模板',                          url: 'https://yuanzhao119.github.io/yijianhan/',                icon: 'fa-solid fa-envelope-open-text' },
      { id: 't3',  title: '施工做法录入系统',                    url: 'https://yuanzhao119.github.io/shizhengzuofa/',            icon: 'fa-solid fa-pen-to-square' },
      { id: 't4',  title: '拨款流程资料清单',                    url: 'https://yuanzhao119.github.io/bukuancailiao/',            icon: 'fa-solid fa-list-check' },
      { id: 't5',  title: '道路挖掘修复费计算系统',              url: 'https://yuanzhao119.github.io/wajuexiufufei/',            icon: 'fa-solid fa-calculator' },
      { id: 't6',  title: '唐山市路北区道路养护工程算量工具',    url: 'https://yuanzhao119.github.io/lbsz/',                     icon: 'fa-solid fa-road' },
      { id: 't7',  title: '蓝奏云',                              url: 'https://pan.lanzoux.com/',                                icon: 'fa-solid fa-cloud' },
      { id: 't8',  title: '道路施工协议书 · 在线编辑',           url: 'https://yuanzhao119.github.io/daolushigongxieyi/',        icon: 'fa-solid fa-file-contract' },
      { id: 't9',  title: '道路占用承诺',                        url: 'https://yuanzhao119.github.io/daoluzhanyongchengnuo/',    icon: 'fa-solid fa-list-check' },
      { id: 't10', title: '挖掘终身承诺',                        url: 'https://yuanzhao119.github.io/wajuezhongshenchengnuo/',   icon: 'fa-solid fa-list-check' },
      { id: 't11', title: '三方施工协议',                        url: 'https://yuanzhao119.github.io/shigongsanfangxieyi/',      icon: 'fa-solid fa-list-check' },
      { id: 't12', title: '维护工程量',                          url: 'https://docs.qq.com/smartsheet/DYkRqZUVPbHJna09x',         icon: 'fa-solid fa-road' },
      { id: 't13', title: '挖掘工程量',                          url: 'https://docs.qq.com/smartsheet/DRUxGdkJxTWxIY0dM?tab=uN0gsF', icon: 'fa-solid fa-road' },
      { id: 't14', title: '唐山工程建设项目联合审批系统（最新）', url: 'http://10.15.1.180:8083/aplanmis-front/',                 icon: 'fa-solid fa-laptop-file' },
      { id: 't15', title: '工作日志提醒',                        url: 'https://yuanzhao119.github.io/gzrztx/',                   icon: 'fa-solid fa-pen-to-square' }
    ]
  };

  /* ==========================================================
     全局状态
     ========================================================== */
  let state = null;
  let editingId = null;
  let pendingTool = null;

  /* ==========================================================
     DOM 引用
     ========================================================== */
  const grid          = document.getElementById('grid');
  const fabAdd        = document.getElementById('fabAdd');

  const accessModal   = document.getElementById('accessModal');
  const accessTitle   = document.getElementById('accessTitle');
  const accessUrl     = document.getElementById('accessUrl');
  const accessConfirm = document.getElementById('accessConfirmBtn');

  const editModal     = document.getElementById('editModal');
  const editModalTitle= document.getElementById('editModalTitle');
  const editTitleEl   = document.getElementById('editTitle');
  const editUrlEl     = document.getElementById('editUrl');
  const editIconEl    = document.getElementById('editIcon');
  const editIconPrev  = document.getElementById('editIconPreview');
  const editIconPicker= document.getElementById('editIconPicker');
  const editSaveBtn   = document.getElementById('editSaveBtn');

  /* ==========================================================
     通用工具
     ========================================================== */
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function uid() {
    return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  function extractDomain(url) {
    try {
      const u = new URL(url);
      let host = u.hostname;
      if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) {
        return host + (u.port ? ':' + u.port : '');
      }
      return host.replace(/^www\./, '');
    } catch (e) {
      return url.length > 42 ? url.slice(0, 39) + '…' : url;
    }
  }

  function isValidUrl(url) {
    try { new URL(url); return true; } catch (e) { return false; }
  }

  /* ==========================================================
     持久化
     ========================================================== */
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.tools)) {
          state = { tools: parsed.tools };
          return;
        }
      }
    } catch (e) { /* 忽略损坏数据 */ }

    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    saveState();
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      alert('保存失败：浏览器存储空间可能已满。请清理浏览器数据后重试。');
    }
  }

  /* ==========================================================
     渲染：卡片列表
     ========================================================== */
  function renderCards() {
    if (!state.tools.length) {
      grid.innerHTML =
        '<div class="empty-state">' +
          '<i class="fa-solid fa-inbox"></i>' +
          '<p>暂无工具，点击右下角按钮添加</p>' +
        '</div>';
      return;
    }

    grid.innerHTML = state.tools.map(function (tool, idx) {
      const icon = tool.icon || 'fa-solid fa-link';
      const domain = extractDomain(tool.url);
      return (
        '<div class="card" data-id="' + escapeHtml(tool.id) + '" style="animation-delay:' + (idx * 0.04) + 's">' +
          '<div class="card-actions">' +
            '<button class="icon-btn" data-action="edit" data-id="' + escapeHtml(tool.id) + '" title="编辑">' +
              '<i class="fa-solid fa-pen"></i>' +
            '</button>' +
            '<button class="icon-btn danger" data-action="delete" data-id="' + escapeHtml(tool.id) + '" title="删除">' +
              '<i class="fa-solid fa-trash"></i>' +
            '</button>' +
          '</div>' +
          '<div class="card-head">' +
            '<div class="card-icon"><i class="' + escapeHtml(icon) + '"></i></div>' +
            '<div class="card-title">' + escapeHtml(tool.title) + '</div>' +
          '</div>' +
          '<div class="card-domain">' +
            '<i class="fa-solid fa-globe"></i>' +
            '<span>' + escapeHtml(domain) + '</span>' +
          '</div>' +
          '<button class="card-cta" data-action="access" data-id="' + escapeHtml(tool.id) + '">' +
            '立即访问 <i class="fa-solid fa-arrow-right"></i>' +
          '</button>' +
        '</div>'
      );
    }).join('');
  }

  /* ==========================================================
     渲染：图标选择器
     ========================================================== */
  function renderIconPicker(container, onPick) {
    container.innerHTML = ICON_LIST.map(function (ic) {
      return '<button type="button" class="icon-chip" data-icon="' + ic + '" title="' + ic + '">' +
               '<i class="' + ic + '"></i>' +
             '</button>';
    }).join('');

    container.querySelectorAll('.icon-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        onPick(btn.dataset.icon);
      });
    });
  }

  /* ==========================================================
     编辑模态框
     ========================================================== */
  function updateEditIconPreview() {
    const val = editIconEl.value.trim() || 'fa-solid fa-link';
    editIconPrev.innerHTML = '<i class="' + escapeHtml(val) + '"></i>';
  }

  function openEditModal(tool) {
    editingId = tool ? tool.id : null;

    editModalTitle.innerHTML = tool
      ? '<i class="fa-solid fa-pen-to-square"></i> 编辑工具'
      : '<i class="fa-solid fa-plus"></i> 添加新工具';

    editTitleEl.value = tool ? tool.title : '';
    editUrlEl.value   = tool ? tool.url   : '';
    editIconEl.value  = tool ? (tool.icon || 'fa-solid fa-link') : 'fa-solid fa-link';

    updateEditIconPreview();
    openModal(editModal);

    setTimeout(function () { editTitleEl.focus(); }, 120);
  }

  function saveEdit() {
    const title = editTitleEl.value.trim();
    const url   = editUrlEl.value.trim();
    const icon  = editIconEl.value.trim() || 'fa-solid fa-link';

    if (!title) { alert('请填写工具名称。'); editTitleEl.focus(); return; }
    if (!url)   { alert('请填写网址。'); editUrlEl.focus(); return; }
    if (!isValidUrl(url)) {
      alert('网址格式不正确，请以 http:// 或 https:// 开头。');
      editUrlEl.focus();
      return;
    }

    if (editingId) {
      const tool = state.tools.find(function (t) { return t.id === editingId; });
      if (tool) {
        tool.title = title;
        tool.url = url;
        tool.icon = icon;
      }
    } else {
      state.tools.push({
        id: uid(),
        title: title,
        url: url,
        icon: icon
      });
    }

    saveState();
    renderCards();
    closeModal(editModal);
  }

  /* ==========================================================
     访问确认模态框
     ========================================================== */
  function openAccessModal(tool) {
    pendingTool = tool;
    accessTitle.textContent = tool.title;
    accessUrl.textContent = tool.url;
    openModal(accessModal);
  }

  function confirmAccess() {
    if (pendingTool && isValidUrl(pendingTool.url)) {
      window.open(pendingTool.url, '_blank', 'noopener,noreferrer');
    } else if (pendingTool) {
      alert('该网址格式不正确，无法访问。请先编辑修正。');
    }
    closeModal(accessModal);
  }

  /* ==========================================================
     模态框开关
     ========================================================== */
  function openModal(modal) {
    modal.classList.add('active');
    document.body.classList.add('modal-open');
  }

  function closeModal(modal) {
    modal.classList.remove('active');
    if (!document.querySelector('.modal-overlay.active')) {
      document.body.classList.remove('modal-open');
    }
  }

  /* ==========================================================
     事件绑定
     ========================================================== */
  function bindEvents() {

    grid.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;
      const tool = state.tools.find(function (t) { return t.id === id; });
      if (!tool) return;

      if (action === 'access') {
        openAccessModal(tool);
      } else if (action === 'edit') {
        openEditModal(tool);
      } else if (action === 'delete') {
        const ok = confirm('确定删除「' + tool.title + '」？\n删除后可重新添加，但无法恢复。');
        if (!ok) return;
        state.tools = state.tools.filter(function (t) { return t.id !== id; });
        saveState();
        renderCards();
      }
    });

    fabAdd.addEventListener('click', function () {
      openEditModal(null);
    });

    accessConfirm.addEventListener('click', confirmAccess);

    editSaveBtn.addEventListener('click', saveEdit);

    editIconEl.addEventListener('input', updateEditIconPreview);

    [editTitleEl, editUrlEl, editIconEl].forEach(function (el) {
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
      });
    });

    document.querySelectorAll('[data-close]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const overlay = btn.closest('.modal-overlay');
        if (overlay) closeModal(overlay);
      });
    });

    document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal(overlay);
      });
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(function (m) {
          closeModal(m);
        });
      }
    });
  }

  /* ==========================================================
     初始化
     ========================================================== */
  function init() {
    loadState();
    renderCards();

    renderIconPicker(editIconPicker, function (icon) {
      editIconEl.value = icon;
      updateEditIconPreview();
    });

    bindEvents();
  }

  init();

})();
</script>
</body>
</html>
