<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市政设施服务所 · 智慧工具台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='8' width='20' height='13' rx='1.5' fill='%232c3e4f'/%3E%3Cpath d='M2 10l10 6 10-6' fill='none' stroke='%23ffffff' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --navy:#2c3e4f;
    --navy-deep:#1e2b36;
    --accent:#e67e22;
    --accent-deep:#d36d12;
    --bg-a:#e9eef4;
    --bg-b:#d9e0e8;
    --text:#1d2c38;
    --sub:#647b8a;
    --tile:#eef3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI","Helvetica Neue",system-ui,sans-serif;
    background:linear-gradient(145deg,var(--bg-a) 0%,var(--bg-b) 100%);
    min-height:100vh;color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  /* 顶部机构条 */
  .gov-bar{
    background:var(--navy);color:#fff;text-align:center;
    padding:12px 16px;font-size:15px;font-weight:600;letter-spacing:.5px;
    border-bottom:3px solid var(--accent);
  }
  .gov-bar small{display:block;font-weight:400;color:#b9c6d2;font-size:12px;letter-spacing:2px;margin-top:2px;}

  /* 主容器 */
  body{display:flex;flex-direction:column;align-items:center;padding:2rem 1.5rem 1.5rem;}
  .service-hub{
    max-width:1300px;width:100%;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:3rem;padding:2.6rem 2.4rem 2.2rem;
    box-shadow:0 25px 40px -12px rgba(0,20,40,.30), inset 0 1px 4px rgba(255,255,255,.8);
    border:1px solid rgba(255,255,255,.6);
    flex:1;
  }

  .hub-header{
    display:flex;align-items:center;gap:1.1rem;margin-bottom:2.2rem;
    padding-bottom:.7rem;border-bottom:3px solid var(--navy);position:relative;
  }
  .hub-header::after{
    content:'';position:absolute;bottom:-3px;left:0;width:150px;height:3px;
    background:var(--accent);border-radius:3px;
  }
  .header-icon{
    font-size:1.9rem;color:var(--navy);background:#ffffffcc;
    width:66px;height:66px;display:flex;align-items:center;justify-content:center;flex:none;
    border-radius:30% 70% 70% 30% / 30% 30% 70% 70%;
    box-shadow:0 10px 18px -6px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.9);
  }
  .hub-title h1{font-size:1.9rem;font-weight:700;color:var(--navy-deep);line-height:1.2;}
  .hub-title .subhead{font-size:.95rem;color:var(--sub);margin-top:5px;letter-spacing:1px;}
  .hub-tip{margin-left:auto;text-align:right;font-size:12px;color:var(--sub);line-height:1.7;flex:none;}
  .hub-tip b{color:var(--accent);}

  /* 卡片网格 */
  .button-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
  @media (min-width:600px){.button-grid{grid-template-columns:repeat(3,1fr);gap:1.3rem;}}
  @media (min-width:900px){.button-grid{grid-template-columns:repeat(4,1fr);}}
  @media (min-width:1200px){.button-grid{grid-template-columns:repeat(5,1fr);}}

  .service-card{
    position:relative;background:#fff;border-radius:1.7rem .8rem 1.7rem .8rem;
    box-shadow:0 12px 18px -10px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.9), inset 0 0 0 1px rgba(0,0,0,.04);
    display:flex;align-items:center;gap:.9rem;padding:1.1rem .9rem;cursor:pointer;
    border:1px solid rgba(255,255,255,.8);
    transition:all .25s cubic-bezier(.2,.9,.4,1);min-height:88px;
  }
  .service-card:hover{
    transform:translateY(-5px);
    box-shadow:0 24px 30px -14px rgba(0,30,60,.35), inset 0 0 0 1px rgba(230,126,34,.35);
  }
  .card-icon{
    font-size:1.6rem;width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:none;
    background:var(--tile);border-radius:18px 8px 18px 8px;color:var(--navy);
    transition:all .2s;overflow:hidden;
  }
  .card-icon i{font-size:1.55rem;}
  .card-icon img{width:38px;height:38px;object-fit:contain;}
  .service-card:hover .card-icon{background:var(--accent);border-radius:12px 18px 12px 18px;}
  .service-card:hover .card-icon i,.service-card:hover .card-icon img{filter:none;}
  .service-card:hover .card-icon i{color:#fff;}
  .card-text{flex:1;min-width:0;}
  .card-text .title{font-weight:600;font-size:.98rem;line-height:1.35;color:var(--navy-deep);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-text .domain{font-size:.72rem;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-text .go{font-size:.74rem;color:var(--accent);font-weight:600;margin-top:3px;opacity:0;transition:opacity .2s;}
  .service-card:hover .card-text .go{opacity:1;}
  .service-card .del{
    position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;
    background:#f3f5f8;color:#b0b7c2;border:1px solid #e3e8ee;
    display:none;align-items:center;justify-content:center;cursor:pointer;font-size:11px;
  }
  .service-card.is-custom .del{display:flex;}
  .service-card .del:hover{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep);}

  /* 自定义添加区 */
  .custom-section{display:flex;justify-content:flex-end;margin-top:1.4rem;border-top:2px dashed #b7c5d0;padding-top:1.6rem;}
  .add-btn{
    background:var(--navy);color:#fff;border:none;padding:.8rem 1.8rem;border-radius:60px;
    font-size:.98rem;font-weight:500;font-family:inherit;display:inline-flex;align-items:center;gap:10px;
    box-shadow:0 12px 18px -10px var(--navy-deep);cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.3);letter-spacing:.5px;
  }
  .add-btn i{font-size:1.05rem;}
  .add-btn:hover{background:var(--navy-deep);transform:scale(1.02);box-shadow:0 18px 24px -12px #0f1a22;}
  .add-btn:active{transform:scale(.98);}

  .foot{text-align:center;color:#7d8b99;font-size:12px;margin-top:1.4rem;}

  /* 弹窗 */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,30,40,.6);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:1000;
    opacity:0;visibility:hidden;transition:all .2s;padding:18px;
  }
  .modal-overlay.show{opacity:1;visibility:visible;}
  .modal-box{
    background:#fff;max-width:480px;width:100%;border-radius:2.2rem .9rem 2.2rem .9rem;
    padding:1.9rem 1.8rem 1.6rem;box-shadow:0 30px 50px -15px #0a1a24;
    transform:scale(.95);transition:all .2s;border:1px solid #fff;
  }
  .modal-overlay.show .modal-box{transform:scale(1);}
  .modal-box h3{
    font-size:1.35rem;font-weight:700;color:var(--navy-deep);display:flex;align-items:center;gap:10px;
    border-left:5px solid var(--accent);padding-left:.9rem;margin-bottom:1.4rem;
  }
  .modal-box h3 i{color:var(--accent);}

  .form-group{margin-bottom:1.2rem;}
  .form-group label{display:block;font-weight:600;color:var(--navy);margin-bottom:7px;font-size:.9rem;}
  .form-group input[type=text],.form-group input[type=url]{
    width:100%;padding:.85rem 1rem;font-size:16px;border:1px solid #cbd7e0;border-radius:60px;
    background:#f9fcff;transition:.2s;outline:none;color:var(--text);font-family:inherit;
  }
  .form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(230,126,34,.12);background:#fff;}
  .form-group input::placeholder{color:#a0b3c0;}

  .seg{display:flex;gap:.5rem;margin-bottom:.6rem;}
  .seg button{
    flex:1;padding:.55rem .4rem;border-radius:30px;border:1px solid #cbd7e0;background:#f4f7fb;
    font-size:.82rem;color:var(--sub);cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .seg button.on{border-color:var(--accent);color:#fff;background:var(--accent);font-weight:600;}
  .icon-pane{display:none;}
  .icon-pane.show{display:block;}
  .img-row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;}
  .img-pick{cursor:pointer;border:1px dashed #cbd7e0;border-radius:30px;background:#f6f8fb;padding:.5rem .9rem;font-size:.85rem;color:var(--navy);font-family:inherit;}
  .img-pick:hover{border-color:var(--accent);}
  .img-preview{width:50px;height:50px;border-radius:14px;background:var(--tile);display:none;align-items:center;justify-content:center;overflow:hidden;border:1px solid #d7e0ea;}
  .img-preview img{width:100%;height:100%;object-fit:contain;}
  .img-preview.show{display:flex;}
  .form-tip{font-size:.75rem;color:var(--sub);margin-top:6px;}

  /* 跳转确认弹窗内的网址展示 */
  .url-box{background:#f6f8fb;border:1px solid #e3e8ee;border-radius:14px;padding:12px 14px;font-size:.9rem;color:var(--navy);word-break:break-all;display:flex;align-items:flex-start;gap:8px;}
  .url-box .link-ic{color:var(--accent);margin-top:2px;}

  .modal-actions{display:flex;justify-content:flex-end;gap:.8rem;margin-top:1.5rem;}
  .modal-actions button{padding:.7rem 1.5rem;border-radius:60px;border:none;font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s;font-family:inherit;display:flex;align-items:center;gap:8px;}
  .btn-cancel{background:#eef2f6;color:var(--navy);border:1px solid #d3dee7;}
  .btn-cancel:hover{background:#dde5ed;}
  .btn-confirm{background:var(--accent);color:#fff;box-shadow:0 8px 16px -8px #b85e0e;}
  .btn-confirm:hover{background:var(--accent-deep);transform:translateY(-1px);}
  .btn-open{background:var(--navy);color:#fff;box-shadow:0 8px 16px -8px #0f1a22;}
  .btn-open:hover{background:var(--navy-deep);}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:30px;font-size:.9rem;
    opacity:0;transition:.25s;z-index:1100;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:680px){
    body{padding:1.1rem .9rem .9rem;}
    .service-hub{padding:1.5rem 1.1rem 1.3rem;border-radius:2rem;}
    .hub-header{gap:.8rem;flex-wrap:wrap;}
    .header-icon{width:54px;height:54px;font-size:1.5rem;}
    .hub-title h1{font-size:1.35rem;}
    .hub-title .subhead{font-size:.8rem;}
    .hub-tip{display:none;}
    .button-grid{gap:.8rem;}
    .service-card{padding:.9rem .7rem;gap:.6rem;min-height:80px;}
    .card-icon{width:44px;height:44px;border-radius:14px 6px 14px 6px;}
    .card-icon i{font-size:1.25rem;}
    .card-text .title{font-size:.88rem;}
    .custom-section{justify-content:center;}
    .add-btn{width:100%;justify-content:center;}
    .modal-box{padding:1.4rem 1.2rem;}
  }
</style>
</head>
<body>

<div class="gov-bar">
  唐山市城市管理综合行政执法局 · 市政设施服务所
  <small>常用业务网址导航 · 点击图标查看网址并跳转</small>
</div>

<div class="service-hub">
  <div class="hub-header">
    <div class="header-icon"><i class="fa-solid fa-building-columns"></i></div>
    <div class="hub-title">
      <h1>市政设施服务所</h1>
      <div class="subhead">智慧工具 · 一键直达</div>
    </div>
    <div class="hub-tip">点击图标 → 查看网址 → <b>新窗口打开</b><br>支持自定义添加网址与按钮图标</div>
  </div>

  <div class="button-grid" id="cardGrid"></div>

  <div class="custom-section">
    <button class="add-btn" id="openAdd"><i class="fa-solid fa-plus"></i> 自定义添加网址</button>
  </div>
</div>

<div class="foot">自添条目保存在本机浏览器中</div>

<!-- 跳转确认弹窗 -->
<div class="modal-overlay" id="jumpModal">
  <div class="modal-box">
    <h3><i class="fa-solid fa-up-right-from-square"></i> 打开网址</h3>
    <div class="form-group">
      <label id="jumpTitle">标题</label>
      <div class="url-box">
        <i class="fa-solid fa-link link-ic"></i>
        <span id="jumpUrl"></span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close="jumpModal"><i class="fa-solid fa-times"></i> 取消</button>
      <button class="btn-open" id="btnOpen"><i class="fa-solid fa-arrow-up-right-from-square"></i> 在新窗口中打开</button>
    </div>
  </div>
</div>

<!-- 添加网址弹窗 -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <h3><i class="fa-solid fa-link"></i> 添加新工具</h3>
    <div class="form-group">
      <label for="inpName">显示名称</label>
      <input type="text" id="inpName" placeholder="例如：道路挖掘修复费计算系统" maxlength="30">
    </div>
    <div class="form-group">
      <label for="inpUrl">网址 URL</label>
      <input type="url" id="inpUrl" placeholder="https://example.com">
    </div>
    <div class="form-group">
      <label>按钮图标（选填）</label>
      <div class="seg" id="seg">
        <button type="button" data-seg="fa" class="on"><i class="fa-solid fa-shapes"></i> 系统图标</button>
        <button type="button" data-seg="img"><i class="fa-solid fa-image"></i> 自定义图片</button>
      </div>
      <div class="icon-pane show" data-pane="fa">
        <input type="text" id="inpFa" placeholder="图标类名，如 fa-road / fa-calculator" value="fa-globe">
        <div class="form-tip">填 Font Awesome 图标类名，留空用默认图标。</div>
      </div>
      <div class="icon-pane" data-pane="img">
        <div class="img-row">
          <label class="img-pick">选择图片<input type="file" id="inpFile" accept="image/*" style="display:none"></label>
          <span class="img-preview" id="imgPrev"><img id="imgPrevImg" alt=""></span>
        </div>
        <div class="form-tip">上传本地图片作为按钮图标（≤1MB）。</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" data-close="addModal"><i class="fa-solid fa-times"></i> 取消</button>
      <button class="btn-confirm" id="btnSave"><i class="fa-solid fa-check"></i> 添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var DEFAULT_ITEMS = [
    {title:'停工通知书（正联/副联）', url:'https://yuanzhao119.github.io/tgtzd/', icon:'fa-solid fa-file-signature'},
    {title:'道路施工协议书 · 在线编辑', url:'https://yuanzhao119.github.io/daolushigongxieyi/', icon:'fa-solid fa-file-contract'},
    {title:'意见函模板', url:'https://yuanzhao119.github.io/yijianhan/', icon:'fa-solid fa-envelope-open-text'},
    {title:'施工做法录入系统', url:'https://yuanzhao119.github.io/shizhengzuofa/', icon:'fa-solid fa-pen-to-square'},
    {title:'拨款流程资料清单', url:'https://yuanzhao119.github.io/bukuancailiao/', icon:'fa-solid fa-list-check'},
    {title:'道路挖掘修复费计算系统', url:'https://yuanzhao119.github.io/wajuexiufufei/', icon:'fa-solid fa-calculator'},
    {title:'唐山市路北区道路养护工程算量工具', url:'https://yuanzhao119.github.io/lbsz/', icon:'fa-solid fa-road'},
    {title:'蓝奏云', url:'https://pan.lanzoux.com/', icon:'fa-solid fa-cloud'}
  ];

  var LS_KEY='shizheng-nav-custom-v2';
  var grid=document.getElementById('cardGrid');
  var custom=loadCustom();

  function loadCustom(){ try{ var a=JSON.parse(localStorage.getItem(LS_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){return [];} }
  function saveCustom(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(custom)); }catch(e){ toast('保存失败：存储空间可能已满'); } }

  function extractDomain(u){ try{ return (new URL(u)).hostname.replace(/^www\./,''); }catch(e){ return u; } }
  function esc(t){ var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

  function iconHtml(icon){
    icon=icon||'fa-solid fa-globe';
    if(/^(data:image|https?:)/i.test(icon)){ return '<img src="'+icon+'" alt="">'; }
    return '<i class="'+icon+'"></i>';
  }

  function render(){
    var items=DEFAULT_ITEMS.concat(custom);
    if(!items.length){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#5a6f7e;padding:2rem;">暂无网址，请点击下方按钮添加</div>'; return; }
    grid.innerHTML=items.map(function(it,idx){
      var isCus=idx>=DEFAULT_ITEMS.length;
      return '<div class="service-card'+(isCus?' is-custom':'')+'" data-idx="'+idx+'">'
           + '<div class="card-icon">'+iconHtml(it.icon)+'</div>'
           + '<div class="card-text">'
           +   '<span class="title">'+esc(it.title)+'</span>'
           +   '<span class="domain">'+esc(extractDomain(it.url))+'</span>'
           +   '<span class="go">查看网址 ›</span>'
           + '</div>'
           + (isCus?'<span class="del" title="删除" data-del="'+idx+'"><i class="fa-solid fa-xmark"></i></span>':'')
           + '</div>';
    }).join('');
  }

  /* ---- 跳转确认 ---- */
  var currentUrl='';
  function openJump(item){
    currentUrl=item.url;
    document.getElementById('jumpTitle').textContent=item.title;
    document.getElementById('jumpUrl').textContent=item.url;
    document.getElementById('jumpModal').classList.add('show');
  }
  document.getElementById('btnOpen').addEventListener('click',function(){
    if(currentUrl) window.open(currentUrl,'_blank','noopener');
    document.getElementById('jumpModal').classList.remove('show');
  });

  grid.addEventListener('click',function(e){
    var del=e.target.closest('.del');
    if(del){
      var idx=parseInt(del.getAttribute('data-del'),10);
      var item=DEFAULT_ITEMS.concat(custom)[idx];
      if(confirm('确定删除「'+item.title+'」吗？')){ custom.splice(idx-DEFAULT_ITEMS.length,1); saveCustom(); render(); }
      return;
    }
    var card=e.target.closest('.service-card');
    if(card) openJump(DEFAULT_ITEMS.concat(custom)[parseInt(card.getAttribute('data-idx'),10)]);
  });

  /* ---- 添加网址 ---- */
  var segMode='fa', pickedData='';
  var seg=document.getElementById('seg');
  seg.addEventListener('click',function(e){
    var b=e.target.closest('[data-seg]'); if(!b) return;
    segMode=b.getAttribute('data-seg');
    seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    document.querySelectorAll('.icon-pane').forEach(function(p){ p.classList.toggle('show', p.getAttribute('data-pane')===segMode); });
  });

  var imgPrev=document.getElementById('imgPrev'), imgPrevImg=document.getElementById('imgPrevImg');
  function showPrev(s){ imgPrevImg.src=s; imgPrev.classList.add('show'); }
  function hidePrev(){ imgPrevImg.removeAttribute('src'); imgPrev.classList.remove('show'); }

  document.getElementById('inpFile').addEventListener('change',function(){
    var f=this.files&&this.files[0]; if(!f) return;
    if(f.size>1024*1024){ toast('图片不能超过 1MB，请压缩后再试'); this.value=''; return; }
    var r=new FileReader();
    r.onload=function(){ pickedData=r.result; showPrev(pickedData); };
    r.readAsDataURL(f);
  });

  function openAdd(){
    document.getElementById('inpName').value='';
    document.getElementById('inpUrl').value='';
    document.getElementById('inpFa').value='fa-globe';
    document.getElementById('inpFile').value='';
    pickedData=''; hidePrev();
    segMode='fa';
    seg.querySelectorAll('button').forEach(function(b,i){ b.classList.toggle('on',i===0); });
    document.querySelectorAll('.icon-pane').forEach(function(p){ p.classList.toggle('show',p.getAttribute('data-pane')==='fa'); });
    document.getElementById('addModal').classList.add('show');
  }
  document.getElementById('openAdd').addEventListener('click',openAdd);

  function normUrl(u){ u=u.trim(); if(!u) return ''; if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(u)) u='https://'+u; return u; }

  document.getElementById('btnSave').addEventListener('click',function(){
    var title=document.getElementById('inpName').value.trim();
    var url=normUrl(document.getElementById('inpUrl').value);
    if(!title){ toast('请输入显示名称'); return; }
    if(!url){ toast('请输入网址'); return; }
    var icon;
    if(segMode==='img'){ icon=pickedData||'fa-solid fa-globe'; }
    else{
      var fa=document.getElementById('inpFa').value.trim();
      if(!fa||fa==='fa-globe'){ icon='fa-solid fa-globe'; }
      else{
        fa=fa.split(/\s+/)[0];
        icon=fa.indexOf('fa-')===0?('fa-solid '+fa):('fa-solid fa-'+fa);
      }
    }
    custom.push({title:title,url:url,icon:icon});
    saveCustom(); render();
    document.getElementById('addModal').classList.remove('show');
    toast('已添加「'+title+'」');
  });

  /* ---- 公共 ---- */
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click',function(){ document.getElementById(b.getAttribute('data-close')).classList.remove('show'); });
  });
  document.querySelectorAll('.modal-overlay').forEach(function(m){
    m.addEventListener('click',function(e){ if(e.target===m) m.classList.remove('show'); });
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') document.querySelectorAll('.modal-overlay.show').forEach(function(m){m.classList.remove('show');}); });

  var tt;
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('show');},2200); }

  render();
})();
</script>
</body>
</html>
